services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stok
      POSTGRES_PASSWORD: stok
      POSTGRES_DB: stok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stok"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://stok:stok@db:5432/stok
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
